name: MyTodo C0-06 snapshot bootstrap and edit CAS
on:
  workflow_dispatch:
  push:
    branches: [master, 'c0-06/**']
    paths:
      - '.github/workflows/c0-06-bootstrap.yml'
      - 'tests/c006/bootstrap/**'
      - 'tests/c006/c006-harness/**'
      - 'src/**'
      - 'windows/**'
      - 'android/**'
permissions:
  contents: read
concurrency:
  group: mytodo-c006-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  javascript:
    name: Real snapshot interruption and concurrent edit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select existing supported Node runtime
        run: bash scripts/ci/c004-node-path.sh
      - name: Execute four supplemental production-path cases
        run: |
          mkdir -p "$RUNNER_TEMP/c006-bootstrap"
          node --experimental-sqlite tests/c006/bootstrap/runner.mjs --output "$RUNNER_TEMP/c006-bootstrap" > "$RUNNER_TEMP/c006-bootstrap/run.log" 2>&1
      - name: Seal complete evidence after final writer
        if: always()
        run: node tests/c006/c006-harness/seal-evidence.mjs "$RUNNER_TEMP/c006-bootstrap"
      - name: Retain failures, SQLite and actual HTTP process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c006-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c006-bootstrap/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
