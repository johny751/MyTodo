name: MyTodo C0-05 real Windows DPAPI interoperability

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/c0-05-credentials.yml'
      - '.github/workflows/c0-04-protocol.yml'
      - 'tests/credential-harness/**'
      - 'windows/sync.c'
      - 'windows/credential-helper.c'
      - 'windows/util.c'
      - 'src/sync-server.mjs'

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.sha }}

jobs:
  credentials:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select preinstalled Node
        shell: pwsh
        run: ./scripts/ci/c004-node-path.ps1
      - name: Build and execute same-user production credential paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'c005'
          New-Item -ItemType Directory -Force "$out/bin", "$out/reports" | Out-Null
          $receipt = @{sourceSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;imageOS=$env:ImageOS;imageVersion=$env:ImageVersion;startedAt=[DateTime]::UtcNow.ToString('o');finishedAt=$null;exitCode=$null;steps=@();toolVersions=@{node=(& node --version);powershell=$PSVersionTable.PSVersion.ToString()}}
          try {
            & node tests/credential-harness/build-credentials.mjs "$out/bin/credentials.exe" *> "$out/native-build.log"
            $code = $LASTEXITCODE
            $receipt.steps += @{name='production-native-build';exitCode=$code}
            if ($code -ne 0) { throw 'Native credential adapter build failed' }
            & node scripts/build-credential-helper.mjs "$out/bin/credential-helper.exe" *> "$out/helper-build.log"
            $code = $LASTEXITCODE
            $receipt.steps += @{name='production-helper-build';exitCode=$code}
            if ($code -ne 0) { throw 'Native credential helper build failed' }
            & node tests/credential-harness/run-credentials.mjs "$out/bin/credentials.exe" "$out/bin/credential-helper.exe" "$out/reports" *> "$out/credentials.log"
            $code = $LASTEXITCODE
            $receipt.steps += @{name='real-dpapi-interoperability';exitCode=$code}
            $receipt.exitCode = $code
          } catch {
            $receipt.failure = $_.Exception.Message
            $receipt.exitCode = 1
          } finally {
            $receipt.finishedAt = [DateTime]::UtcNow.ToString('o')
            $receipt | ConvertTo-Json -Depth 12 | Set-Content "$out/execution.json" -Encoding utf8
            $manifest = @(Get-ChildItem $out -File -Recurse | ForEach-Object { @{path=[IO.Path]::GetRelativePath($out,$_.FullName).Replace('\','/');bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()} })
            $manifest | ConvertTo-Json -Depth 5 | Set-Content "$out/sha256.json" -Encoding utf8
          }
          exit $receipt.exitCode
      - name: Preserve execution receipts and artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c005-credentials-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c005/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
