name: MyTodo C0-06 Android internal migration interruption
on:
  workflow_dispatch:
  push:
    branches: [master, 'c0-06/**']
    paths:
      - '.github/workflows/c0-06-android-interruption.yml'
      - 'tests/c006/android-kill/**'
      - 'tests/c006/c006-harness/**'
      - 'src/**'
      - 'android/**'
permissions:
  contents: read
concurrency:
  group: mytodo-c006-android-kill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-interruption:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      MYTODO_ANDROID_IMAGE_INSTALL: '1'
      MYTODO_ANDROID_PULSE_INSTALL: '1'
      MYTODO_ANDROID_IMAGE_REVISION: ${{ vars.MYTODO_ANDROID_IMAGE_REVISION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the existing supported Node runtime
        run: bash scripts/ci/c004-node-path.sh
      - name: Provision the authorized API 34 emulator runtime
        id: emulator
        run: node scripts/ci/c004-android-emulator.mjs start
      - name: Build isolated interruption adapter and execute real Android process deaths
        run: |
          mkdir -p "$RUNNER_TEMP/c006-android-kill"
          node tests/c006/android-kill/prepare-android-kill.mjs "$RUNNER_TEMP/c006-android-kill/shell" > "$RUNNER_TEMP/c006-android-kill/prepare.log" 2>&1
          node "$RUNNER_TEMP/c006-android-kill/shell/build-android.mjs" --root "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/c006-android-kill/build" > "$RUNNER_TEMP/c006-android-kill/build.log" 2>&1
          node tests/c006/android-kill/android-kill-runner.mjs --output "$RUNNER_TEMP/c006-android-kill/cases" --apk "$RUNNER_TEMP/c006-android-kill/build/mytodo-c003-test.apk" --serial "$MYTODO_ANDROID_SERIAL" --environment "$RUNNER_TEMP/c004-android-emulator/environment.json" > "$RUNNER_TEMP/c006-android-kill/run.log" 2>&1
      - name: Stop emulator and finish exact-run runtime evidence
        if: ${{ always() && !cancelled() && steps.emulator.outcome != 'skipped' }}
        run: node scripts/ci/c004-android-emulator.mjs finish
      - name: Seal the complete build and interruption evidence
        if: always()
        run: node tests/c006/c006-harness/seal-evidence.mjs "$RUNNER_TEMP/c006-android-kill"
      - name: Preserve actual interruption evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c006-android-kill-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c006-android-kill/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Seal final emulator and dependency receipts
        if: always()
        run: node tests/c006/c006-harness/seal-evidence.mjs "$RUNNER_TEMP/c004-android-emulator"
      - name: Preserve exact Android runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c006-android-kill-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c004-android-emulator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
