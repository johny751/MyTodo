 document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id||'';try{
  if(action==='work-restore-tasks'&&H.flattenTasks(composite().tasks).find(t=>t.id===id)?.archiveInherited){toast('请先恢复所属的父任务');return;}if(action.startsWith('work-')){W.act(action,id,context());return;}
  if(action==='go')navigate(id);else if(action==='nav-toggle')document.querySelector('.app-shell').classList.toggle('nav-open');else if(action==='task-new')modal(taskForm('',id));else if(action==='task-open')openTask(id);else if(action==='close-modal')closeModal();else if(action==='detail-go'){selected=id;navigate('task-detail');}else if(action==='quadrant-focus'){view.status='pending';view.query='';navigate('tasks');document.querySelector('[data-quadrant="'+id+'"]')?.scrollIntoView({block:'center'});}else if(action==='task-toggle'){const t=toggleTask(id);if(drawerId){const showing=drawerId;openTask(showing);}toast(t.done?'已取消完成':'已完成任务'+(t.repeat?'，已按规则安排下一次':''));}else if(action==='task-filter-reset'){Object.assign(view,{query:'',status:'pending',date:today,period:'day',allDates:false,sort:'time',projectId:''});render();}else if(action==='task-delete')modal('<h2>删除这项演示任务？</h2><p>子任务会一同删除，其他工作条目保留。</p><div class="form-actions">'+button('取消','task-open',id)+button('确认删除','task-delete-confirm',id,'danger')+'</div>');else if(action==='task-delete-confirm'){const ids=H.flattenTasks([repo.getTask(id)]).map(t=>t.id);repo.batch(()=>{repo.deleteTask(id);repo.updateDemo(d=>{ids.forEach(x=>{delete d.taskLinks?.[x];});d.archivedTaskIds=(d.archivedTaskIds||[]).filter(x=>!ids.includes(x));});});closeModal();toast('已删除演示任务');}else if(action==='reminders')reminderCenter();else if(action==='reset-ask')modal('<h2>恢复初始演示数据？</h2><p>会清除当前 Demo 中的修改并重新载入合成示例。</p><div class="form-actions">'+button('取消','close-modal')+button('确认重置','reset-confirm','','danger')+'</div>');else if(action==='reset-confirm'){repo.reset();selected='d4-task-0';Object.assign(view,{query:'',projectId:'',status:'pending'});navigate('dashboard');toast('已恢复初始演示数据');}else if(action==='export-demo'){const data={kind:D.STORAGE_KIND,version:1,state:repo.state,demo:repo.demo,sourceSHA:window.D4_BUILD?.sourceSha||'',exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mytodo-d4-synthetic-workspace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前合成工作区');}
 }catch(e){toast(e.message||'操作未完成');}});
 document.addEventListener('submit',event=>{const form=event.target.closest('[data-form]');if(!form)return;event.preventDefault();if(!form.reportValidity())return;const values=new FormData(form),name=form.dataset.form;try{
  if(name.startsWith('work-')){W.submit(name,values,context());return;}if(name==='task-edit')saveTask(values);else if(name==='subtask-add'){const parentId=values.get('parentId');let child;repo.batch(()=>{child=repo.addSubtask(parentId,values.get('title'));repo.updateDemo(d=>{d.taskLinks=d.taskLinks||{};d.taskLinks[child.id]=structuredClone(d.taskLinks[parentId]||{});});});if(drawerId)openTask(parentId);toast('已添加子任务');}else if(name==='task-filter'){Object.assign(view,{query:values.get('query'),status:values.get('status'),projectId:values.get('projectId'),date:values.get('date')||today,period:values.get('period'),allDates:values.has('allDates'),sort:values.get('sort')});render();}else if(name==='global-search')globalSearch(values.get('query'));else if(name==='settings'){repo.updateDemo(d=>{d.ui={compact:values.has('compact'),defaultStatus:values.get('defaultStatus')};});toast('已保存演示偏好');}
 }catch(e){toast(e.message||'保存失败');}});
 document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();document.querySelector('.global-search input')?.focus();}if(event.key==='Escape')closeModal();if(event.key==='Tab'&&document.querySelector('.modal')){const focusable=[...document.querySelectorAll('.modal button,.modal input:not([type=hidden]),.modal select,.modal textarea,.modal a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
 window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(routes.some(r=>r[0]===next)&&next!==route){route=next;closeModal();render();}});
 repo.subscribe(scheduleRender);route=routes.some(r=>r[0]===location.hash.slice(1))?location.hash.slice(1):'dashboard';render();
 window.D4Prototype=Object.freeze({repo,getState:composite,navigate,getView:()=>({...view}),getRoute:()=>route,storageKey:D.STORAGE_KEY,kind:D.STORAGE_KIND,routes:routes.map(r=>r[0])});
}());

})();

</script>
</body></html>
